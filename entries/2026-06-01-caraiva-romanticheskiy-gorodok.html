<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caraiva - романтический городок - Дневник наблюдений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --text: #151515;
      --muted: #6f6f6f;
      --soft: #a8a8a8;
      --line: #e8e8e8;
      --paper: #ffffff;
      --wash: #f7f7f4;
      --accent: #315f54;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--wash);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-weight: 300;
    }
    .page {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 76px;
    }
    .back {
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 500;
      text-decoration: none;
    }
    .back:hover { text-decoration: underline; }
    article {
      margin-top: 38px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    time {
      display: block;
      color: var(--soft);
      font-size: 0.88rem;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 30px;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .content {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(22px, 5vw, 42px);
    }
    .media {
      margin: 0 0 28px;
    }
    .media img,
    .media video {
      display: block;
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      background: #111;
      border-radius: 8px;
    }
    p {
      margin: 0 0 1.25rem;
      color: #343434;
      font-size: 1.06rem;
      line-height: 1.82;
      overflow-wrap: anywhere;
    }
    p:last-child { margin-bottom: 0; }
    @media (max-width: 640px) {
      .page {
        width: min(100% - 28px, 760px);
        padding-top: 32px;
      }
      article { margin-top: 30px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="../index.html">Назад к дневнику</a>
    <article>
      <time datetime="2026-06-01">01.06.2026, 18:09</time>
      <h1>Caraiva - романтический городок</h1>
      <div class="content">
        <figure class="media">
          <img src="../media/2026-06-01-caraiva-romanticheskiy-gorodok.jpg" alt="Caraiva - романтический городок" loading="lazy" />
        </figure>
        <p>Тут все красиво но 2 дня это максимум</p>
      </div>
    </article>
  </main>
</body>
</html>
